<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="980" viewBox="0 0 2048 980" role="img" aria-labelledby="title desc">
  <title id="title">삼각형 주 격자에서 오각형과 육각형 쌍대 셀을 만드는 과정</title>
  <desc id="desc">위쪽은 다섯 삼각형의 중심을 이어 오각형을 만들고, 아래쪽은 여섯 삼각형의 중심을 이어 육각형을 만드는 세 단계를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L16 9 L1 17" fill="none" stroke="#253842" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Column markers, matching the numbered, hand-drawn language of the preceding figure. -->
  <g>
    <circle cx="520" cy="74" r="43" fill="none" stroke="#172a34" stroke-width="3.5"/>
    <text x="520" y="92" font-family="DejaVu Sans" font-size="50" font-weight="700" text-anchor="middle" fill="#172a34">1</text>
    <circle cx="1050" cy="74" r="43" fill="none" stroke="#172a34" stroke-width="3.5"/>
    <text x="1050" y="92" font-family="DejaVu Sans" font-size="50" font-weight="700" text-anchor="middle" fill="#172a34">2</text>
    <circle cx="1590" cy="74" r="43" fill="none" stroke="#172a34" stroke-width="3.5"/>
    <text x="1590" y="92" font-family="DejaVu Sans" font-size="50" font-weight="700" text-anchor="middle" fill="#172a34">3</text>
  </g>

  <!-- Row badges: five incident triangles above, six below. -->
  <g>
    <path d="M154 201 L221 250 L195 329 L113 329 L87 250 Z" fill="#8a5bbb" stroke="#5e368c" stroke-width="5" stroke-linejoin="round"/>
    <text x="154" y="287" font-family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <path d="M85 662 L154 622 L223 662 L223 742 L154 782 L85 742 Z" fill="#2993ba" stroke="#176b8b" stroke-width="5" stroke-linejoin="round"/>
    <text x="154" y="724" font-family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
  </g>

  <!-- Hand-drawn flow arrows. -->
  <g fill="none" stroke="#253842" stroke-width="5" stroke-linecap="round">
    <path d="M748 277 C792 273 824 275 861 277"/>
    <path d="M1278 277 C1321 273 1357 274 1395 277"/>
    <path d="M748 704 C792 699 824 701 861 704"/>
    <path d="M1278 704 C1321 699 1357 701 1395 704"/>
  </g>
  <g fill="none" stroke="#253842" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M816 249 L861 277 L816 305"/><path d="M1350 249 L1395 277 L1350 305"/>
    <path d="M816 676 L861 704 L816 732"/><path d="M1350 676 L1395 704 L1350 732"/>
  </g>
  <g fill="none" stroke="#71828c" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
    <path d="M748 281 C792 276 825 279 858 281"/><path d="M1278 281 C1324 277 1355 278 1392 281"/>
    <path d="M748 708 C793 704 824 705 858 708"/><path d="M1278 708 C1324 704 1356 705 1392 708"/>
  </g>

  <!-- 1: primal fans. Five triangles around an inherited icosahedron vertex. -->
  <g transform="translate(520 277)" fill="#f5fafc" stroke="#a9d9e9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="0,0 0,-145 138,-45"/>
    <polygon points="0,0 138,-45 85,117"/>
    <polygon points="0,0 85,117 -85,117"/>
    <polygon points="0,0 -85,117 -138,-45"/>
    <polygon points="0,0 -138,-45 0,-145"/>
    <path d="M0 -145 L138 -45 L85 117 L-85 117 L-138 -45 Z M0 0 L0 -145 M0 0 L138 -45 M0 0 L85 117 M0 0 L-85 117 M0 0 L-138 -45" fill="none" stroke="#20333d" stroke-width="3.2"/>
    <circle cx="0" cy="0" r="10" fill="#172d38" stroke="#83cce6" stroke-width="6"/>
  </g>

  <!-- 1: six triangles around a subdivision vertex. -->
  <g transform="translate(520 704)" fill="#f5fafc" stroke="#a9d9e9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="0,0 145,0 72.5,125.6"/>
    <polygon points="0,0 72.5,125.6 -72.5,125.6"/>
    <polygon points="0,0 -72.5,125.6 -145,0"/>
    <polygon points="0,0 -145,0 -72.5,-125.6"/>
    <polygon points="0,0 -72.5,-125.6 72.5,-125.6"/>
    <polygon points="0,0 72.5,-125.6 145,0"/>
    <path d="M145 0 L72.5 125.6 L-72.5 125.6 L-145 0 L-72.5 -125.6 L72.5 -125.6 Z M0 0 L145 0 M0 0 L72.5 125.6 M0 0 L-72.5 125.6 M0 0 L-145 0 M0 0 L-72.5 -125.6 M0 0 L72.5 -125.6" fill="none" stroke="#20333d" stroke-width="3.2"/>
    <circle cx="0" cy="0" r="10" fill="#172d38" stroke="#83cce6" stroke-width="6"/>
  </g>

  <!-- 2: the same fans with one point at each triangle center. -->
  <g transform="translate(1050 277)">
    <path d="M0 -145 L138 -45 L85 117 L-85 117 L-138 -45 Z M0 0 L0 -145 M0 0 L138 -45 M0 0 L85 117 M0 0 L-85 117 M0 0 L-138 -45" fill="#f8fcfd" stroke="#91bfd0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.58"/>
    <polygon points="46,-63.3 74.3,24 0,78 -74.3,24 -46,-63.3" fill="none" stroke="#8b5abd" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f3ad43" stroke="#fff7df" stroke-width="4"><circle cx="46" cy="-63.3" r="8"/><circle cx="74.3" cy="24" r="8"/><circle cx="0" cy="78" r="8"/><circle cx="-74.3" cy="24" r="8"/><circle cx="-46" cy="-63.3" r="8"/></g>
    <circle cx="0" cy="0" r="9" fill="#172d38" stroke="#83cce6" stroke-width="6"/>
  </g>
  <g transform="translate(1050 704)">
    <path d="M145 0 L72.5 125.6 L-72.5 125.6 L-145 0 L-72.5 -125.6 L72.5 -125.6 Z M0 0 L145 0 M0 0 L72.5 125.6 M0 0 L-72.5 125.6 M0 0 L-145 0 M0 0 L-72.5 -125.6 M0 0 L72.5 -125.6" fill="#f8fcfd" stroke="#91bfd0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.58"/>
    <polygon points="72.5,41.9 0,83.7 -72.5,41.9 -72.5,-41.9 0,-83.7 72.5,-41.9" fill="none" stroke="#2993ba" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f3ad43" stroke="#fff7df" stroke-width="4"><circle cx="72.5" cy="41.9" r="8"/><circle cx="0" cy="83.7" r="8"/><circle cx="-72.5" cy="41.9" r="8"/><circle cx="-72.5" cy="-41.9" r="8"/><circle cx="0" cy="-83.7" r="8"/><circle cx="72.5" cy="-41.9" r="8"/></g>
    <circle cx="0" cy="0" r="9" fill="#172d38" stroke="#83cce6" stroke-width="6"/>
  </g>

  <!-- 3: connected centers become the dual cell that surrounds the original vertex. -->
  <g transform="translate(1590 277)">
    <path d="M0 -145 L138 -45 L85 117 L-85 117 L-138 -45 Z M0 0 L0 -145 M0 0 L138 -45 M0 0 L85 117 M0 0 L-85 117 M0 0 L-138 -45" fill="#f8fcfd" stroke="#91bfd0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/>
    <polygon points="46,-63.3 74.3,24 0,78 -74.3,24 -46,-63.3" fill="#f2eafb" stroke="#7545a6" stroke-width="6" stroke-linejoin="round"/>
    <g fill="#f3ad43" stroke="#fff7df" stroke-width="4"><circle cx="46" cy="-63.3" r="7"/><circle cx="74.3" cy="24" r="7"/><circle cx="0" cy="78" r="7"/><circle cx="-74.3" cy="24" r="7"/><circle cx="-46" cy="-63.3" r="7"/></g>
    <circle cx="0" cy="0" r="10" fill="#172d38" stroke="#83cce6" stroke-width="6"/>
  </g>
  <g transform="translate(1590 704)">
    <path d="M145 0 L72.5 125.6 L-72.5 125.6 L-145 0 L-72.5 -125.6 L72.5 -125.6 Z M0 0 L145 0 M0 0 L72.5 125.6 M0 0 L-72.5 125.6 M0 0 L-145 0 M0 0 L-72.5 -125.6 M0 0 L72.5 -125.6" fill="#f8fcfd" stroke="#91bfd0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/>
    <polygon points="72.5,41.9 0,83.7 -72.5,41.9 -72.5,-41.9 0,-83.7 72.5,-41.9" fill="#e8f5fa" stroke="#1b84aa" stroke-width="6" stroke-linejoin="round"/>
    <g fill="#f3ad43" stroke="#fff7df" stroke-width="4"><circle cx="72.5" cy="41.9" r="7"/><circle cx="0" cy="83.7" r="7"/><circle cx="-72.5" cy="41.9" r="7"/><circle cx="-72.5" cy="-41.9" r="7"/><circle cx="0" cy="-83.7" r="7"/><circle cx="72.5" cy="-41.9" r="7"/></g>
    <circle cx="0" cy="0" r="10" fill="#172d38" stroke="#83cce6" stroke-width="6"/>
  </g>

  <!-- Uneven second passes keep the geometry exact without making it mechanically perfect. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#532f7d" stroke-width="1.6" opacity="0.58">
      <path d="M154 198 L224 249 M223 252 L197 332 M194 333 L112 332 M109 330 L84 250 M87 247 L153 198"/>
    </g>
    <g stroke="#165e7b" stroke-width="1.6" opacity="0.58">
      <path d="M84 661 L154 620 M157 621 L225 661 M225 664 L225 743 M222 745 L154 785 M151 784 L83 743 M83 740 L83 664"/>
    </g>
    <!-- Primal fans: slightly mismatched black passes. -->
    <g transform="translate(520 277)">
      <g stroke="#172d38" stroke-width="1.5" opacity="0.62">
        <path d="M-1 1 L1 -143 M1 0 L136 -44 M0 1 L83 115 M-1 0 L-84 115 M0 -1 L-135 -43"/>
      </g>
    </g>
    <g transform="translate(520 704)">
      <g stroke="#172d38" stroke-width="1.5" opacity="0.62">
        <path d="M1 1 L143 0 M0 1 L70 122 M-1 1 L-70 122 M-1 -1 L-141 0 M0 -1 L-70 -122 M1 -1 L71 -121"/>
      </g>
    </g>
  </g>
</svg>
