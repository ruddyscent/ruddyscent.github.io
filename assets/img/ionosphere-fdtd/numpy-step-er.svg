<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">NumPy Er update pipeline</title><desc id="desc">Ht dual-cell circulation and source current update lossy Er.</desc>
  <defs><filter id="handdrawn" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.024" numOctaves="2" seed="29" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.45"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#385a73" stroke-width="1.8"/></marker><style>text{font-family:"Nanum Pen Script","Comic Sans MS","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24384b}.title{font-size:46px;font-weight:700}.label{font-size:31px;font-weight:700}.body{font-size:26px}.formula{font-size:27px;font-weight:700}.shape{font-size:22px;fill:#596d80}rect,path{stroke-linecap:round;stroke-linejoin:round;filter:url(#handdrawn)}</style></defs>
  <text class="title" x="38" y="50">③ 방사 전기장 E_r 갱신</text>
  <rect x="35" y="82" width="1130" height="292" rx="24" fill="#f5fafe" stroke="#8db6cf" stroke-width="2"/>
  <rect x="65" y="120" width="205" height="100" rx="16" fill="#dff1ec" stroke="#5a9b89" stroke-width="2"/><text class="label" x="168" y="160" text-anchor="middle">H_t</text><text class="shape" x="168" y="192" text-anchor="middle">(N_e, N_r+1)</text>
  <rect x="65" y="250" width="205" height="82" rx="16" fill="#f7f1df" stroke="#be943d" stroke-width="2"/><text class="label" x="168" y="285" text-anchor="middle">J_source</text><text class="shape" x="168" y="314" text-anchor="middle">선택된 꼭짓점·층</text>
  <rect x="340" y="120" width="285" height="212" rx="18" fill="#fff" stroke="#6b9dbb" stroke-width="2"/><text class="body" x="483" y="160" text-anchor="middle">오각형·육각형의 둘레</text><text class="label" x="483" y="202" text-anchor="middle">쌍대 셀 순환</text><text class="formula" x="483" y="246" text-anchor="middle">Σ sign · H_t · dual length</text><text class="shape" x="483" y="286" text-anchor="middle">÷ dual-cell area</text>
  <rect x="710" y="120" width="415" height="212" rx="20" fill="#e5f2f8" stroke="#4f8eb4" stroke-width="2.5"/><text class="body" x="918" y="158" text-anchor="middle">손실 계수와 파원 전류를 함께 반영</text><text class="formula" x="918" y="202" text-anchor="middle">E_r *= C_a</text><text class="formula" x="918" y="240" text-anchor="middle">E_r += C_b · circulation</text><text class="formula" x="918" y="278" text-anchor="middle">E_r −= C_b · J_source</text><text class="label" x="918" y="316" text-anchor="middle">→ E_r (N_v, N_r+1)</text>
  <path d="M270 170 L337 170" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M270 291 C304 291 310 275 337 275" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 226 L707 226" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
