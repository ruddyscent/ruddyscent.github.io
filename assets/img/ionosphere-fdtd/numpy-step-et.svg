<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">NumPy Et update pipeline</title><desc id="desc">Hr dual-edge differences and Ht radial differences form the curl that updates lossy Et.</desc>
  <defs><filter id="handdrawn" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.024" numOctaves="2" seed="31" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.45"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#604a82" stroke-width="1.8"/></marker><style>text{font-family:"Nanum Pen Script","Comic Sans MS","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#28384b}.title{font-size:46px;font-weight:700}.label{font-size:31px;font-weight:700}.body{font-size:26px}.formula{font-size:27px;font-weight:700}.shape{font-size:22px;fill:#596d80}rect,path{stroke-linecap:round;stroke-linejoin:round;filter:url(#handdrawn)}</style></defs>
  <text class="title" x="38" y="50">④ 접선 전기장 E_t 갱신</text>
  <rect x="35" y="78" width="1130" height="320" rx="24" fill="#fbf9fe" stroke="#ae9acb" stroke-width="2"/>
  <rect x="65" y="120" width="205" height="100" rx="16" fill="#f7ead5" stroke="#c09043" stroke-width="2"/><text class="label" x="168" y="158" text-anchor="middle">H_r</text><text class="shape" x="168" y="190" text-anchor="middle">(N_f, N_r)</text>
  <rect x="65" y="262" width="205" height="100" rx="16" fill="#dff1ec" stroke="#5a9b89" stroke-width="2"/><text class="label" x="168" y="300" text-anchor="middle">H_t</text><text class="shape" x="168" y="332" text-anchor="middle">(N_e, N_r+1)</text>
  <rect x="340" y="112" width="285" height="116" rx="16" fill="#fff" stroke="#c09043" stroke-width="2"/><text class="body" x="483" y="150" text-anchor="middle">모서리 좌우 면의 차이</text><text class="formula" x="483" y="188" text-anchor="middle">H_r[left] − H_r[right]</text>
  <rect x="340" y="254" width="285" height="116" rx="16" fill="#fff" stroke="#5a9b89" stroke-width="2"/><text class="body" x="483" y="292" text-anchor="middle">위아래 H_t의 차이</text><text class="formula" x="483" y="330" text-anchor="middle">diff_r(H_t)</text>
  <path d="M270 170 L337 170" fill="none" stroke="#604a82" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M270 312 L337 312" fill="none" stroke="#604a82" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="715" y="132" width="410" height="205" rx="20" fill="#eee8f7" stroke="#8062a9" stroke-width="2.5"/><text class="body" x="920" y="172" text-anchor="middle">두 차이를 계량 인자로 보정해 결합</text><text class="formula" x="920" y="214" text-anchor="middle">curl = diff_s(H_r) − diff_r(H_t)</text><text class="formula" x="920" y="252" text-anchor="middle">E_t *= C_a</text><text class="formula" x="920" y="286" text-anchor="middle">E_t += C_b · curl</text><text class="label" x="920" y="322" text-anchor="middle">→ E_t (N_e, N_r)</text>
  <path d="M625 170 C672 170 668 205 712 205" fill="none" stroke="#604a82" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 312 C672 312 668 272 712 272" fill="none" stroke="#604a82" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
