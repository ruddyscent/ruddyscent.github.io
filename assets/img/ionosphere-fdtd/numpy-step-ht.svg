<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">NumPy Ht update pipeline</title>
  <desc id="desc">Er surface differences and Et radial differences are combined with metric terms to update Ht.</desc>
  <defs>
    <filter id="handdrawn" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.024" numOctaves="2" seed="19" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#385a73" stroke-width="1.8"/></marker>
    <style>
      text{font-family:"Nanum Pen Script","Comic Sans MS","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#22364b}.title{font-size:46px;font-weight:700}.label{font-size:32px;font-weight:700}.body{font-size:27px}.formula{font-size:28px;font-weight:700}.shape{font-size:23px;fill:#53677b}rect,path,line{stroke-linecap:round;stroke-linejoin:round;filter:url(#handdrawn)}
    </style>
  </defs>
  <text class="title" x="38" y="50">① 접선 자기장 H_t 갱신</text>
  <rect x="35" y="78" width="1130" height="320" rx="24" fill="#f5fafe" stroke="#8db6cf" stroke-width="2"/>
  <rect x="65" y="120" width="205" height="100" rx="16" fill="#dcecf6" stroke="#5d9ac0" stroke-width="2"/>
  <text class="label" x="168" y="158" text-anchor="middle">E_r</text><text class="shape" x="168" y="190" text-anchor="middle">(N_v, N_r+1)</text>
  <rect x="65" y="262" width="205" height="100" rx="16" fill="#eee7f7" stroke="#8e72b4" stroke-width="2"/>
  <text class="label" x="168" y="300" text-anchor="middle">E_t</text><text class="shape" x="168" y="332" text-anchor="middle">(N_e, N_r)</text>
  <rect x="340" y="112" width="285" height="116" rx="16" fill="#fff" stroke="#6b9dbb" stroke-width="2"/>
  <text class="body" x="483" y="150" text-anchor="middle">모서리 양 끝의 차이</text><text class="formula" x="483" y="188" text-anchor="middle">E_r[head] − E_r[tail]</text>
  <rect x="340" y="254" width="285" height="116" rx="16" fill="#fff" stroke="#9a83bd" stroke-width="2"/>
  <text class="body" x="483" y="292" text-anchor="middle">방사 방향 차이 + PEC</text><text class="formula" x="483" y="330" text-anchor="middle">diff_r(E_t)</text>
  <path d="M270 170 L337 170" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M270 312 L337 312" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="715" y="145" width="410" height="180" rx="20" fill="#e5f2f8" stroke="#4f8eb4" stroke-width="2.5"/>
  <text class="body" x="920" y="188" text-anchor="middle">길이와 반경 간격으로 나눈 뒤 결합</text>
  <text class="formula" x="920" y="235" text-anchor="middle">grad_s(E_r) − diff_r(E_t)</text>
  <text class="shape" x="920" y="270" text-anchor="middle">× dt / μ₀</text>
  <text class="label" x="920" y="308" text-anchor="middle">H_t += temporary</text>
  <path d="M625 170 C672 170 668 205 712 205" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 312 C672 312 668 272 712 272" fill="none" stroke="#385a73" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
