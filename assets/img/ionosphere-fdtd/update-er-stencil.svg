<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">방사 전기장 업데이트 스텐실</title>
  <desc id="desc">TM-r 평면의 정육각형 또는 오각형 둘레를 따라 접선 자기장을 순환시키고 같은 위치의 방사 전류를 반영해 셀 중심의 방사 전기장을 갱신한다.</desc>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".017 .05" numOctaves="1" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/></filter>
    <marker id="coral-arrow" viewBox="0 0 10 10" markerWidth="6.5" markerHeight="6.5" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d2644a" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="dark-arrow" viewBox="0 0 10 10" markerWidth="6.5" markerHeight="6.5" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#302b27" stroke-width="1.8" stroke-linecap="round"/></marker>
    <style>
      text{font-family:"Segoe Print","Bradley Hand","Comic Sans MS","Nanum Pen Script",sans-serif;fill:#302b27}.title{font-size:36px;font-weight:700}.subtitle{font-size:26px}.label{font-size:25px}.field{font-size:31px;font-weight:700}.sub{font-size:21px;font-weight:700}.electric{fill:#3276b1}.magnetic{fill:#d2644a}.source{fill:#8066a3}.tm{fill:#4c8b73}.metric{fill:#c8943e}.sketch{filter:url(#wobble);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <text class="title" x="36" y="43">③ 방사 전기장 업데이트</text>
  <text class="subtitle" x="36" y="73">셀 둘레의 자기장 순환과 중심의 전류를 함께 반영한다.</text>

  <g class="sketch">
    <!-- Side 180, height 180√3: an exact regular hexagon before the hand-drawn filter. -->
    <path d="M410 104.115 L590 104.115 L680 260 L590 415.885 L410 415.885 L320 260 Z" fill="#4c8b73" fill-opacity=".08" stroke="#302b27" stroke-width="3.2"/>
    <path d="M450 104.115 L550 104.115" fill="none" stroke="#d2644a" stroke-width="5" marker-end="url(#coral-arrow)"/>
    <path d="M610 138.4 L660 225.7" fill="none" stroke="#d2644a" stroke-width="5" marker-end="url(#coral-arrow)"/>
    <path d="M660 294.3 L610 381.6" fill="none" stroke="#d2644a" stroke-width="5" marker-end="url(#coral-arrow)"/>
    <path d="M550 415.885 L450 415.885" fill="none" stroke="#d2644a" stroke-width="5" marker-end="url(#coral-arrow)"/>
    <path d="M390 381.6 L340 294.3" fill="none" stroke="#d2644a" stroke-width="5" marker-end="url(#coral-arrow)"/>
    <path d="M340 225.7 L390 138.4" fill="none" stroke="#d2644a" stroke-width="5" marker-end="url(#coral-arrow)"/>
    <circle cx="500" cy="260" r="38" fill="#c8943e" fill-opacity=".14" stroke="#c8943e" stroke-width="3"/>
    <circle cx="500" cy="260" r="7" fill="#3276b1"/><circle cx="500" cy="260" r="17" fill="none" stroke="#3276b1" stroke-width="2.6"/>
    <path d="M500 342 L500 299" fill="none" stroke="#8066a3" stroke-width="5" marker-end="url(#dark-arrow)"/>
    <path d="M810 168 C888 220 888 315 810 370" fill="none" stroke="#302b27" stroke-width="2.4" marker-end="url(#dark-arrow)"/>
  </g>

  <text class="label tm" x="45" y="126">TM-r 평면</text>
  <text class="label" x="45" y="157">오각형은 모서리 하나만 적다</text>

  <text class="field magnetic" x="474" y="150">H</text><text class="sub magnetic" x="496" y="157">t</text>
  <text class="field magnetic" x="691" y="184">H</text><text class="sub magnetic" x="713" y="191">t</text>
  <text class="field magnetic" x="691" y="360">H</text><text class="sub magnetic" x="713" y="367">t</text>
  <text class="field magnetic" x="474" y="455">H</text><text class="sub magnetic" x="496" y="462">t</text>
  <text class="field magnetic" x="274" y="360">H</text><text class="sub magnetic" x="296" y="367">t</text>
  <text class="field magnetic" x="274" y="184">H</text><text class="sub magnetic" x="296" y="191">t</text>

  <text class="field electric" x="535" y="257">E</text><text class="sub electric" x="555" y="264">r</text>
  <text class="field source" x="516" y="342">J</text><text class="sub source" x="532" y="349">r</text>
  <text class="label metric" x="443" y="303">셀 면적</text>

  <text class="label" x="818" y="215">둘레의 합</text>
  <text class="label" x="840" y="251">− 전류</text>
  <text class="label" x="840" y="287">÷ 면적</text>
  <text class="label" x="840" y="323">↓</text>
  <text class="field electric" x="826" y="360">E</text><text class="sub electric" x="846" y="367">r</text>
</svg>
