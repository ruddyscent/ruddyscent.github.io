<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
  <title id="t">미분 가능 FDTD로 역산하기</title>
  <desc id="d">물질 모형에서 FDTD로 순전파해 모의 파형을 얻고, 관측과의 손실을 자동미분으로 되돌려 물질 모형을 갱신하는 반복 과정. Hu 외(2022)의 미분 가능 프로그래밍 아이디어를 재작성한 개념도.</desc>
  <defs>
    <filter id="wi" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".015 .04" numOctaves="1" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/></filter>
    <marker id="i-dark" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#302b27" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="i-gold" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c8943e" stroke-width="1.8" stroke-linecap="round"/></marker>
    <style>
      text{font-family:"Nanum Pen Script","Segoe Print","Comic Sans MS","Apple SD Gothic Neo",sans-serif;fill:#302b27}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:24px}.box{font-size:23px;font-weight:700}.small{font-size:20px}
      .electric{fill:#3276b1}.magnetic{fill:#d2644a}.hid{fill:#8066a3}.metric{fill:#c8943e}
      .sketch{filter:url(#wi);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <text class="title" x="34" y="42">미분 가능 FDTD로 역산하기</text>
  <text class="subtitle" x="34" y="74">순전파는 시뮬레이션, 역전파는 최적화 — 같은 코드로.</text>

  <g class="sketch">
    <!-- forward chain -->
    <rect x="60" y="150" width="170" height="86" rx="14" fill="#8066a3" fill-opacity=".10" stroke="#302b27" stroke-width="3"/>
    <rect x="300" y="150" width="170" height="86" rx="14" fill="#3276b1" fill-opacity=".10" stroke="#302b27" stroke-width="3"/>
    <rect x="540" y="150" width="170" height="86" rx="14" fill="#3276b1" fill-opacity=".07" stroke="#302b27" stroke-width="3"/>
    <rect x="775" y="150" width="165" height="86" rx="14" fill="#d2644a" fill-opacity=".10" stroke="#302b27" stroke-width="3"/>
    <path d="M232 193 L296 193" fill="none" stroke="#302b27" stroke-width="3" marker-end="url(#i-dark)"/>
    <path d="M472 193 L536 193" fill="none" stroke="#302b27" stroke-width="3" marker-end="url(#i-dark)"/>
    <path d="M712 193 L771 193" fill="none" stroke="#302b27" stroke-width="3" marker-end="url(#i-dark)"/>
    <!-- backward gradient loop -->
    <path d="M857 240 C857 340 470 360 145 300 L145 240" fill="none" stroke="#c8943e" stroke-width="3.4" stroke-dasharray="2 8" marker-end="url(#i-gold)"/>
  </g>

  <text class="box hid" x="145" y="182" text-anchor="middle">물질 모형</text>
  <text class="box hid" x="145" y="212" text-anchor="middle">ε(x)</text>
  <text class="box electric" x="385" y="200" text-anchor="middle">FDTD 순전파</text>
  <text class="box" x="625" y="192" text-anchor="middle">모의 파형</text>
  <text class="small" x="625" y="218" text-anchor="middle">vs 관측 데이터</text>
  <text class="box magnetic" x="857" y="200" text-anchor="middle">손실</text>
  <text class="label metric" x="500" y="352" text-anchor="middle">∇ 자동미분(역전파)로 ε 갱신 · 반복</text>

  <text class="small" x="34" y="430">같은 계산 그래프를 거슬러 물질 분포를 되찾는다 (Hu 외, 2022 개념도)</text>
</svg>
