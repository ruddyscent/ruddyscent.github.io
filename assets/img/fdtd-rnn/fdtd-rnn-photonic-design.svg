<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
  <title id="t">경사로 다듬는 광자 소자</title>
  <desc id="d">입력 모드가 설계 영역을 지나 목표 출력으로 나가도록, 수반법·자동미분으로 얻은 경사가 설계 영역의 굴절률 분포를 반복해서 다듬는다. 미분 가능 FDTD·FDFD 광자 역설계(2024) 아이디어를 재작성한 개념도.</desc>
  <defs>
    <filter id="wp" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".015 .04" numOctaves="1" seed="14" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/></filter>
    <marker id="p-blue" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3276b1" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="p-red" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d2644a" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="p-gold" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c8943e" stroke-width="1.8" stroke-linecap="round"/></marker>
    <style>
      text{font-family:"Nanum Pen Script","Segoe Print","Comic Sans MS","Apple SD Gothic Neo",sans-serif;fill:#302b27}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:24px}.label{font-size:23px}.small{font-size:20px}
      .electric{fill:#3276b1}.magnetic{fill:#d2644a}.metric{fill:#c8943e}
      .sketch{filter:url(#wp);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <text class="title" x="34" y="42">경사로 다듬는 광자 소자</text>
  <text class="subtitle" x="34" y="74">목표 응답을 향해 굴절률 분포를 경사하강으로 설계한다.</text>

  <g class="sketch">
    <!-- input mode -->
    <path d="M70 250 L172 250" fill="none" stroke="#3276b1" stroke-width="4.4" marker-end="url(#p-blue)"/>
    <!-- design region: pixel grid -->
    <rect x="330" y="150" width="200" height="200" rx="10" fill="none" stroke="#302b27" stroke-width="3.2"/>
    <g stroke="#c8943e" stroke-width="1.2" stroke-opacity=".5">
      <path d="M380 150 L380 350"/><path d="M430 150 L430 350"/><path d="M480 150 L480 350"/>
      <path d="M330 200 L530 200"/><path d="M330 250 L530 250"/><path d="M330 300 L530 300"/>
    </g>
    <g fill="#8066a3" fill-opacity=".8">
      <rect x="332" y="152" width="46" height="46"/><rect x="432" y="202" width="46" height="46"/>
      <rect x="382" y="252" width="46" height="46"/><rect x="482" y="152" width="46" height="46"/>
      <rect x="332" y="302" width="46" height="46"/>
    </g>
    <path d="M175 250 L326 250" fill="none" stroke="#302b27" stroke-width="2.4" stroke-opacity=".4"/>
    <!-- output to target -->
    <path d="M534 250 L700 250" fill="none" stroke="#d2644a" stroke-width="4.4" marker-end="url(#p-red)"/>
    <!-- gradient arrow reshaping -->
    <path d="M720 320 C620 380 470 380 430 356" fill="none" stroke="#c8943e" stroke-width="3.4" stroke-dasharray="2 8" marker-end="url(#p-gold)"/>
  </g>

  <text class="small electric" x="70" y="238">입력 모드</text>
  <text class="label metric" x="430" y="142" text-anchor="middle">설계 영역 · 굴절률 분포</text>
  <text class="label magnetic" x="715" y="242">목표 출력</text>
  <text class="label metric" x="735" y="330">수반법·자동미분 경사</text>

  <text class="small" x="34" y="430">미분 가능 FDTD·FDFD로 나노구조를 경사 기반 설계 (미분 가능 광자 설계, 2024 개념도)</text>
</svg>
