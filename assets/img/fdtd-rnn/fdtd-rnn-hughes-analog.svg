<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
  <title id="t">파동 매질이 곧 아날로그 순환 신경망</title>
  <desc id="d">입력 파형을 훈련된 불균일 매질에 통과시키면, 산란된 에너지가 여러 출력 탐침 중 하나로 모여 분류가 이뤄진다. Hughes 외(2019)의 아날로그 파동 RNN 아이디어를 재작성한 개념도.</desc>
  <defs>
    <filter id="wh" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".015 .04" numOctaves="1" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/></filter>
    <marker id="h-dark" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#302b27" stroke-width="1.8" stroke-linecap="round"/></marker>
    <style>
      text{font-family:"Nanum Pen Script","Segoe Print","Comic Sans MS","Apple SD Gothic Neo",sans-serif;fill:#302b27}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:24px}.label{font-size:23px}.small{font-size:20px}
      .electric{fill:#3276b1}.magnetic{fill:#d2644a}.hid{fill:#8066a3}
      .sketch{filter:url(#wh);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <text class="title" x="34" y="42">파동 매질이 곧 아날로그 RNN</text>
  <text class="subtitle" x="34" y="74">훈련된 매질에 파형을 통과시켜 분류한다.</text>

  <g class="sketch">
    <!-- input waveform -->
    <path d="M70 250 q14 -34 28 0 t28 0 t28 0" fill="none" stroke="#3276b1" stroke-width="3.4"/>
    <path d="M156 250 L232 250" fill="none" stroke="#302b27" stroke-width="3" marker-end="url(#h-dark)"/>
    <!-- medium box -->
    <rect x="245" y="150" width="330" height="210" rx="20" fill="#8066a3" fill-opacity=".09" stroke="#302b27" stroke-width="3.2"/>
    <!-- scatterers -->
    <g fill="#8066a3" fill-opacity=".55">
      <circle cx="300" cy="200" r="7"/><circle cx="360" cy="250" r="9"/><circle cx="330" cy="315" r="6"/>
      <circle cx="420" cy="195" r="7"/><circle cx="460" cy="285" r="8"/><circle cx="500" cy="220" r="6"/>
      <circle cx="410" cy="330" r="7"/><circle cx="520" cy="310" r="7"/>
    </g>
    <!-- wavefronts -->
    <path d="M280 190 q40 60 0 130" fill="none" stroke="#3276b1" stroke-width="2.4" stroke-opacity=".7"/>
    <path d="M330 180 q48 70 0 150" fill="none" stroke="#5a91bf" stroke-width="2.2" stroke-opacity=".6"/>
    <!-- to probes -->
    <path d="M578 255 L640 255" fill="none" stroke="#302b27" stroke-width="3" marker-end="url(#h-dark)"/>
    <!-- probes -->
    <circle cx="690" cy="200" r="20" fill="none" stroke="#d2644a" stroke-width="3"/>
    <circle cx="690" cy="255" r="24" fill="#d2644a" fill-opacity=".85" stroke="#d2644a" stroke-width="3"/>
    <circle cx="690" cy="312" r="20" fill="none" stroke="#d2644a" stroke-width="3"/>
  </g>

  <text class="label hid" x="410" y="145" text-anchor="middle">불균일 매질 (은닉 상태)</text>
  <text class="small electric" x="70" y="300">입력 음성</text>
  <text class="label" x="726" y="208">모음 A</text>
  <text class="label magnetic" x="726" y="263">모음 B ✓</text>
  <text class="label" x="726" y="320">모음 C</text>
  <text class="small" x="640" y="360">에너지 최대 = 예측</text>

  <text class="small" x="34" y="430">입력 파형 → 산란 → 가장 큰 출력이 분류 결과 (Hughes 외, 2019 개념도)</text>
</svg>
