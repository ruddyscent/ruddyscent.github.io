    .cite { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #8493a2; }
    .formula { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3c5267; }
    .eblue { fill: #2563eb; }
