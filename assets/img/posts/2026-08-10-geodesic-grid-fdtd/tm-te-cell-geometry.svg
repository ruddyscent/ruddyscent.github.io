<rect width="1160" height="560" fill="#fff"/>
<text class="title" x="40" y="48">셀 하나에서 장이 놓이는 자리</text>
<text class="subtitle" x="40" y="74">TM 셀(육각형·오각형)은 중심에 방사 전기장, 모서리에 접선 자기장을 둔다. TE 셀(삼각형)은 그 반대다.</text>
<rect x="32" y="98" width="700" height="416" rx="16" fill="#f7fafc" stroke="#becbd7"/>
<rect x="748" y="98" width="380" height="416" rx="16" fill="#fbf9fe" stroke="#c3b3dc"/>
<text class="stage" x="52" y="128">(a) TM 셀 — 앙페르 법칙</text>
<text class="small" x="52" y="150">둘레의 H 순환을 넓이로 나눠 중심의 E_r를 갱신</text>
<text class="stage" x="768" y="128">(b) TE 셀 — 패러데이 법칙</text>
<text class="small" x="768" y="150">둘레의 E 순환을 넓이로 나눠 중심의 H_r를 갱신</text>
