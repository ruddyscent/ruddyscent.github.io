<svg viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
<defs>
<style>
    .title { font: 700 26px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
