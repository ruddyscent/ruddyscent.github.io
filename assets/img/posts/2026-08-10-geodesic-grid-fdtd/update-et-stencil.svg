<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Tangential electric-field update stencil</title>
  <desc id="desc">표면과 방사 방향에서 본 그림. 주 모서리 위의 접선 전기장 Et, 이웃 면 중심의 방사 자기장 Hr, 이웃 TM-r 평면의 접선 자기장 Ht를 보여준다.</desc>
  <defs>
    <marker id="arrow-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #172033; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .grid { fill: none; stroke: #334155; stroke-width: 3; }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .e { fill: none; stroke: #2563eb; stroke-width: 6; marker-end: url(#arrow-e); }
      .h { fill: none; stroke: #c2410c; stroke-width: 5; marker-end: url(#arrow-h); }
      .target { fill: #fef3c7; stroke: #f59e0b; stroke-width: 4; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 17px; }
      .op { font-size: 19px; font-weight: 700; fill: #475569; }
    </style>
  </defs>
  <rect width="1000" height="470" fill="white"/>
  <text x="34" y="40" class="heading">4. 주–쌍대 모서리 교차점에서 E_t 업데이트</text>

  <rect x="25" y="62" width="460" height="335" rx="14" class="panel"/>
  <text x="48" y="94" class="label">TE-r 평면 r_i+1/2 위의 표면 스텐실</text>
  <line x1="93" y1="225" x2="417" y2="225" class="grid" marker-end="url(#arrow-grid)"/>
  <text x="177" y="256" class="small">방향 있는 주 모서리</text>
  <line x1="255" y1="118" x2="255" y2="330" class="guide" marker-end="url(#arrow-grid)"/>
  <text x="270" y="323" class="small">양의 쌍대 방향</text>
  <circle cx="255" cy="145" r="7" fill="#c2410c"/>
  <circle cx="255" cy="305" r="7" fill="#c2410c"/>
  <circle cx="255" cy="145" r="15" fill="none" stroke="#c2410c" stroke-width="2"/>
  <circle cx="255" cy="305" r="15" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="278" y="151" class="label" fill="#c2410c">H_r(왼쪽)</text>
  <text x="278" y="311" class="label" fill="#c2410c">H_r(오른쪽)</text>
  <circle cx="255" cy="225" r="22" class="target"/>
  <line x1="185" y1="225" x2="328" y2="225" class="e"/>
  <text x="330" y="214" class="label" fill="#2563eb">대상 E_t</text>
  <path d="M 222 285 L 222 165" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-grid)"/>
  <text x="142" y="190" class="op">D_d H_r</text>

  <rect x="515" y="62" width="460" height="335" rx="14" class="panel"/>
  <text x="538" y="94" class="label">같은 모서리의 방사 방향 스텐실</text>
  <line x1="560" y1="145" x2="927" y2="145" class="grid"/>
  <line x1="560" y1="230" x2="927" y2="230" class="guide"/>
  <line x1="560" y1="315" x2="927" y2="315" class="grid"/>
  <text x="815" y="134" class="small">TM-r: r_i+1</text>
  <text x="815" y="219" class="small">TE-r: r_i+1/2</text>
  <text x="815" y="304" class="small">TM-r: r_i</text>
  <line x1="610" y1="145" x2="715" y2="145" class="h"/>
  <line x1="610" y1="315" x2="715" y2="315" class="h"/>
  <text x="729" y="173" class="label" fill="#c2410c">H_t(+)</text>
  <text x="729" y="343" class="label" fill="#c2410c">H_t(-)</text>
  <circle cx="664" cy="230" r="22" class="target"/>
  <line x1="610" y1="230" x2="715" y2="230" class="e"/>
  <text x="729" y="263" class="label" fill="#2563eb">대상 E_t</text>
  <path d="M 585 154 L 585 306" fill="none" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-grid)" marker-end="url(#arrow-grid)"/>
  <text x="598" y="204" class="op">D_r H_t</text>

  <circle cx="37" cy="432" r="10" class="target"/><text x="55" y="439" class="small">업데이트되는 자유도</text>
  <line x1="310" y1="432" x2="355" y2="432" class="h"/><text x="368" y="439" class="small">자기장 입력</text>
  <line x1="535" y1="432" x2="580" y2="432" class="e"/><text x="593" y="439" class="small">전기장 대상</text>
</svg>
