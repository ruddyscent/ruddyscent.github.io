<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Primal and dual orientation separated from spherical metric</title>
  <desc id="desc">방향 있는 주 모서리는 꼬리에서 머리로 향하고, 양의 쌍대 모서리는 오른쪽 면 중심에서 왼쪽 면 중심으로 향한다. 이 방향들이 머리 빼기 꼬리, 왼쪽 빼기 오른쪽, 순환의 부호를 정한다. 구면 호 길이와 넓이는 반경·중심각·입체각을 써서 그다음에 따로 적용한다.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2878a8"/></marker>
    <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7453a6"/></marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .panel-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .formula { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #394e63; }
      .sign { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="40" y="45">부호는 위상이, 크기는 계량이 정한다</text>
  <text class="subtitle" x="40" y="71">방향 규약 하나가 반경·길이·면적을 도입하기 전에 모든 차분과 순환의 부호를 정한다.</text>

  <!-- Orientation panel -->
  <rect x="34" y="98" width="522" height="495" rx="18" fill="#f7fafc" stroke="#b7c7d5"/>
  <text class="panel-title" x="58" y="134">국소 주–쌍대 방향</text>

  <polygon points="100,294 290,142 480,294" fill="#e7f1f7" stroke="#668fac" stroke-width="2"/>
  <polygon points="100,294 290,446 480,294" fill="#eee8f7" stroke="#8e72b4" stroke-width="2"/>
  <text class="label" x="290" y="177" text-anchor="middle">왼쪽 면</text>
  <text class="small" x="290" y="198" text-anchor="middle">중심 f_left</text>
  <text class="label" x="290" y="420" text-anchor="middle">오른쪽 면</text>
  <text class="small" x="290" y="441" text-anchor="middle">중심 f_right</text>
  <circle cx="290" cy="218" r="7" fill="#2878a8" stroke="#fff" stroke-width="2"/>
  <circle cx="290" cy="370" r="7" fill="#7453a6" stroke="#fff" stroke-width="2"/>

  <path d="M116 294 L464 294" stroke="#2878a8" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <circle cx="100" cy="294" r="8" fill="#fff" stroke="#2878a8" stroke-width="3"/>
  <circle cx="480" cy="294" r="8" fill="#fff" stroke="#2878a8" stroke-width="3"/>
  <text class="label" x="100" y="324" text-anchor="middle">꼬리</text>
  <text class="label" x="480" y="324" text-anchor="middle">머리</text>
  <text class="sign" x="290" y="280" text-anchor="middle" fill="#286f9a">양의 주 모서리</text>

  <path d="M290 362 L290 226" stroke="#7453a6" stroke-width="5" marker-end="url(#purple-arrow)"/>
  <circle cx="290" cy="294" r="8" fill="#fff" stroke="#596d80" stroke-width="2"/>
  <text class="sign" x="314" y="347" fill="#684695">양의 쌍대 모서리</text>
  <text class="tiny" x="314" y="365">오른쪽 → 왼쪽</text>

  <rect x="72" y="486" width="446" height="76" rx="12" fill="#eef3f7"/>
  <text class="formula" x="90" y="510">모서리 차분:       값[머리] − 값[꼬리]</text>
  <text class="formula" x="90" y="535">쌍대 모서리 차분: 값[왼쪽] − 값[오른쪽]</text>
  <text class="tiny" x="295" y="554" text-anchor="middle">공유 모서리는 이웃 셀에서 반대 경계 부호를 받는다</text>

  <!-- Topology/metric panel -->
  <rect x="584" y="98" width="582" height="495" rx="18" fill="#fbfcfd" stroke="#b7c7d5"/>
  <text class="panel-title" x="608" y="134">재사용하는 접속 + 반경에 의존하는 계량</text>

  <rect x="608" y="158" width="256" height="386" rx="14" fill="#f5f9fc" stroke="#a8c5d8"/>
  <text class="label" x="736" y="187" text-anchor="middle">위상 · 한 번만 만든다</text>
  <rect x="630" y="211" width="212" height="62" rx="9" fill="#e5f1f8"/>
  <text class="formula" x="736" y="236" text-anchor="middle">D_s φ = φ_head − φ_tail</text>
  <text class="small" x="736" y="258" text-anchor="middle">주 모서리마다 값 하나</text>
  <rect x="630" y="289" width="212" height="62" rx="9" fill="#eee8f7"/>
  <text class="formula" x="736" y="314" text-anchor="middle">D_d ψ = ψ_left − ψ_right</text>
  <text class="small" x="736" y="336" text-anchor="middle">쌍대 모서리마다 값 하나</text>
  <rect x="630" y="367" width="212" height="62" rx="9" fill="#e6f3ee"/>
  <text class="formula" x="736" y="392" text-anchor="middle">C_p = Σ s_pe · edge value</text>
  <text class="small" x="736" y="414" text-anchor="middle">방향 있는 면 모서리 셋</text>
  <rect x="630" y="445" width="212" height="76" rx="9" fill="#f6ead1"/>
  <text class="formula" x="736" y="470" text-anchor="middle">C_d = Σ s_de · edge value</text>
  <text class="small" x="736" y="492" text-anchor="middle">방향 있는 쌍대 모서리 다섯 또는 여섯</text>
  <text class="tiny" x="736" y="511" text-anchor="middle">정수 인덱스와 ± 부호뿐</text>

  <path d="M868 351 L894 351" stroke="#647689" stroke-width="2" marker-end="url(#blue-arrow)"/>

  <rect x="898" y="158" width="244" height="386" rx="14" fill="#f9f7fd" stroke="#b7a5d1"/>
  <text class="label" x="1020" y="187" text-anchor="middle">계량 · 반경 r에서 계산</text>
  <circle cx="1020" cy="281" r="64" fill="#eef3f7" stroke="#8096a9" stroke-width="2"/>
  <path d="M969 319 A64 64 0 0 1 1071 319" fill="none" stroke="#2878a8" stroke-width="5"/>
  <path d="M1020 281 L969 319 M1020 281 L1071 319" stroke="#9baab8"/>
  <text class="formula" x="1020" y="267" text-anchor="middle">r</text>
  <text class="small" x="1020" y="345" text-anchor="middle">중심각 θ</text>
  <rect x="924" y="376" width="192" height="126" rx="11" fill="#eee8f7"/>
  <text class="formula" x="1020" y="404" text-anchor="middle">l_p = r θ_p</text>
  <text class="formula" x="1020" y="432" text-anchor="middle">l_d = r θ_d</text>
  <text class="formula" x="1020" y="460" text-anchor="middle">A_p = r² Ω_p</text>
  <text class="formula" x="1020" y="488" text-anchor="middle">A_d = r² Ω_d</text>
  <text class="tiny" x="1020" y="526" text-anchor="middle">모든 껍질에서 같은 각도 격자</text>

  <text class="small" x="600" y="621" text-anchor="middle">접속은 ‘어떤 값을 어떤 부호로?’에, 계량은 ‘어떤 물리적 길이·면적에 대해?’에 답한다.</text>
</svg>
