<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">격자 해상도가 물리적 구조의 수치적 관측 가능성을 결정한다</title>
  <desc id="desc">손으로 그린 듯한 세 패널이 동일한 80 km 구조를 세분화 레벨 2, 6, 8에 올려놓는다. 셀 간격이 1910 km이면 구조가 거대한 한 셀 안에 들어가고, 120 km이면 간격보다 작으며, 30 km이면 여러 셀에 걸쳐 나타난다. 위쪽 스케일 막대는 20 Hz에서 15000 km인 진공 파장을 대비한다.</desc>
  <defs>
    <filter id="handdrawn">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="coarse" width="150" height="130" patternUnits="userSpaceOnUse"><path d="M0 130 L75 0 L150 130 Z M0 0 L75 130 L150 0" fill="none" stroke="#9aa4b2" stroke-width="2.4"/></pattern>
    <pattern id="medium" width="64" height="56" patternUnits="userSpaceOnUse"><path d="M0 56 L32 0 L64 56 Z M0 0 L32 56 L64 0" fill="none" stroke="#9aa4b2" stroke-width="1.8"/></pattern>
    <pattern id="fine" width="30" height="26" patternUnits="userSpaceOnUse"><path d="M0 26 L15 0 L30 26 Z M0 0 L15 26 L30 0" fill="none" stroke="#9aa4b2" stroke-width="1.3"/></pattern>
    <style>
      .ink { fill: none; stroke: #1f2937; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; filter: url(#handdrawn); }
      .thin { stroke-width: 2.1; }
      .grid { filter: url(#handdrawn); }
      .blue { stroke: #2563eb; }
      .amber { stroke: #b45309; }
      .muted { stroke: #6b7280; }
      .note { fill: #1f2937; font-family: "Nanum Pen Script", "Comic Sans MS", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 36px; }
      .small { font-size: 31px; }
      .tiny { font-size: 28px; fill: #4b5563; }
      .label { font-size: 44px; font-weight: 700; }
      .camber { fill: #b45309; }
      .cred { fill: #b91c1c; }
      .cgreen { fill: #15803d; }
      .mono { font-family: "Nanum Pen Script", "Courier New", monospace; }
    </style>
  </defs>

  <g transform="translate(54 46)">
    <text class="note label" x="0" y="0">격자가 표본을 뜰 수 있어야 그 값이 표현된다</text>
    <text class="note small" x="0" y="36">긴 ELF 파장과 국소 지질 구조는 서로 다른 격자 스케일을 요구한다.</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(0 120)">
    <text class="note" x="60" y="30">진공에서 20 Hz</text>
    <path class="ink blue" d="M300 24 C520 16, 900 16, 1120 24" />
    <path class="ink blue thin" d="M300 10 L300 40 M1120 10 L1120 40" />
    <text class="note mono camber" x="710" y="14" text-anchor="middle">λ₀ ≈ 15,000 km</text>
    <text class="note tiny" x="60" y="66">전 지구 파동은 표현되어도 작은 목표물은 여전히 보이지 않을 수 있다 — 예시 목표물 80 km.</text>
  </g>

  <!-- Panel A: level 2 -->
  <g transform="translate(56 250)">
    <text class="note small" x="8" y="30">L2 · 162개 셀</text>
    <text class="note mono tiny camber" x="8" y="58">셀 간격 ≈ 1,910 km</text>
    <rect class="ink" x="8" y="76" width="322" height="196" rx="12" />
    <rect class="grid" x="20" y="88" width="298" height="172" fill="url(#coarse)" />
    <circle class="ink amber" cx="176" cy="176" r="7" />
    <path class="ink thin muted" d="M183 172 L250 146" />
    <text class="note tiny camber" x="254" y="146">80 km 목표물</text>
    <text class="note small cred" x="169" y="310" text-anchor="middle">위치를 잡지 못함</text>
    <text class="note tiny" x="169" y="336" text-anchor="middle">한 셀이 광역을 대표</text>
  </g>

  <!-- Panel B: level 6 -->
  <g transform="translate(438 250)">
    <text class="note small" x="8" y="30">L6 · 40,962개 셀</text>
    <text class="note mono tiny camber" x="8" y="58">셀 간격 ≈ 120 km</text>
    <rect class="ink" x="8" y="76" width="322" height="196" rx="12" />
    <rect class="grid" x="20" y="88" width="298" height="172" fill="url(#medium)" />
    <circle class="ink amber" cx="176" cy="180" r="15" />
    <path class="ink thin muted" d="M188 170 L252 146" />
    <text class="note tiny camber" x="256" y="146">같은 80 km</text>
    <text class="note small camber" x="169" y="310" text-anchor="middle">격자보다 작음</text>
    <text class="note tiny" x="169" y="336" text-anchor="middle">해상도 경고 필요</text>
  </g>

  <!-- Panel C: level 8 -->
  <g transform="translate(820 250)">
    <text class="note small" x="8" y="30">L8 · 655,362개 셀</text>
    <text class="note mono tiny camber" x="8" y="58">셀 간격 ≈ 30 km</text>
    <rect class="ink" x="8" y="76" width="322" height="196" rx="12" />
    <rect class="grid" x="20" y="88" width="298" height="172" fill="url(#fine)" />
    <circle class="ink amber" cx="176" cy="182" r="34" />
    <circle class="camber" cx="162" cy="170" r="3.5" /><circle class="camber" cx="190" cy="170" r="3.5" />
    <circle class="camber" cx="150" cy="194" r="3.5" /><circle class="camber" cx="176" cy="194" r="3.5" /><circle class="camber" cx="202" cy="194" r="3.5" />
    <path class="ink thin muted" d="M206 156 L258 140" />
    <text class="note tiny camber" x="262" y="140">같은 목표물</text>
    <text class="note small cgreen" x="169" y="310" text-anchor="middle">여러 셀에 표현됨</text>
    <text class="note tiny" x="169" y="336" text-anchor="middle">위치와 크기가 드러남</text>
  </g>

  <path class="ink thin muted" d="M180 636 C470 620, 760 622, 1020 636" />
  <text class="note small" x="600" y="678" text-anchor="middle">상세한 물성을 넣어도 부족한 격자 해상도는 메워지지 않는다.</text>
  <text class="note tiny" x="600" y="712" text-anchor="middle">수평·방사 간격을 목표 구조와 함께 비교해야 한다.</text>
</svg>
